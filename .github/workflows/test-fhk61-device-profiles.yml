name: Test FHK61 EEDTOY profiles (no release)
on:
  push:
    branches:
      - test/fhk61-device-profiles
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Validate profiles and complete regression suite
        run: npm test
      - name: Build application UI
        run: npm run build
